name: Preview cleanup

# Removes a PR's preview (gh-pages/pr-<n>/, made by preview.yml on request) when the PR closes, merged or
# not, or loses its `preview` label, and says so in the preview's comment. By hand, for a preview left behind: Actions -> Preview cleanup ->
# Run workflow, with the PR's number. A run that fails in seconds with no step is Actions blocked: run it by hand later.
on:
  pull_request:
    types: [closed, unlabeled]
  workflow_dispatch:
    inputs:
      pr:
        description: The PR whose preview to remove
        required: true
        type: number

permissions:
  contents: read

jobs:
  remove:
    # (a fork's or Dependabot's PR never had a preview, and their token can't write)
    # (a PR that never had the `preview` label has nothing to remove: no run, no comment)
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ((!github.event.repository.private || vars.CI == 'on') && github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]' &&
       ((github.event.action == 'unlabeled' && github.event.label.name == 'preview') ||
        (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview'))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      pages: read
    # the preview's own group: a preview still being written for this PR is cancelled, not left to finish after
    concurrency:
      group: pages-pr-${{ github.event.pull_request.number || inputs.pr }}
      cancel-in-progress: true
    steps:
      # (the scripts as they are on the default branch: the PR's branch may be gone)
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Remove gh-pages/pr-${{ github.event.pull_request.number || inputs.pr }}
        run: .github/scripts/pages.sh remove ${{ github.event.pull_request.number || inputs.pr }}
        env:
          PAGES_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          MESSAGE: Remove the preview of PR ${{ github.event.pull_request.number || inputs.pr }}
      - name: Say so on the PR
        run: .github/scripts/preview-comment.sh ${{ github.event.pull_request.number || inputs.pr }} removed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
