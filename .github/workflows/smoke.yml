name: Smoke

# By hand only: Actions -> Smoke -> Run workflow, for a change that reaches audio, UI wiring, assets or the build. The same
# runs locally for nothing (docs/testing.md). A run that fails in seconds with no step is Actions blocked, not a verdict.
# Opens and starts every piece in the runner's Chrome, and plays for 2 s the fewest pieces that use every kind
# of audio node between them (tools/smoke.mjs, tools/smoke-pick.ts): the audio graph of every voice kind,
# which the unit tests can't build. Then every example is rendered twice (tools/repeatable.mjs), on the same build.
# Not a required check.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job: the smoke test and the renders share one install and one build.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - id: build
        run: npm run build
      - run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # Every example rendered offline twice, 4 s each: the two must agree within -100 dB (what "the same sound" means,
      # docs/testing.md), none of our code may call Math.random, and none may clip or go over the loudness ceiling (#92).
      # (it runs even when the smoke test failed: one run gives both verdicts)
      - name: Renders repeat, under the loudness ceiling
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: node tools/repeatable.mjs 4
        env:
          CHROME_PATH: /usr/bin/google-chrome
