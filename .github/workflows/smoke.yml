name: Smoke

# Opens and starts every piece in the runner's Chrome, and plays for 2 s the fewest pieces that use every kind
# of audio node between them (tools/smoke.mjs, tools/smoke-pick.ts): the audio graph of every voice kind,
# which the unit tests can't build. Then every example is rendered twice (tools/repeatable.mjs). It runs on every PR (opened, pushed to, reopened, taken out of draft), so the
# result is always for the head; `main` after a merge doesn't run it. By hand: Actions -> Smoke -> Run workflow.
# It is not a required check (ruleset: only `check`): the `senior` skill waits for it before merging.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    # (a draft doesn't run it until it is marked ready)
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - run: npm run build
      - run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
      # Every example rendered offline twice, 4 s each: the two must agree within −100 dB (what "the same sound" means,
      # docs/testing.md), none of our code may call Math.random, and none may clip or go over the loudness ceiling (#92).
      - name: Renders repeat, under the loudness ceiling
        if: ${{ !cancelled() }}
        run: node tools/repeatable.mjs 4
        env:
          CHROME_PATH: /usr/bin/google-chrome
