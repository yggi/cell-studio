name: CI

# CI is off for now (broken): runs by hand only; checks are run locally (AGENTS.md). Restore: push on main + pull_request.
on:
  workflow_dispatch:

# (each job asks for what it writes)
permissions:
  contents: read

jobs:
  # The static checks and the build (about a minute), beside the tests, which run in two projects: a PR waits for the
  # slowest of them, not for the sum. `check` below is the one status the ruleset requires; it passes when all three do.
  # (Each job has a concurrency group of its own: sharing one, they would cancel each other. A newer push to a PR, or to
  # main, replaces the jobs still running for the older one: the newer commit carries its changes, so its run tests them
  # too. Only these jobs: a deploy already writing is never cancelled.)
  static:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-static-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  # The tests in their two projects (vite.config.ts), one runner each, about as long: `quick`, and `slow` (the folder over
  # whole pieces and libraries). Both whole, on every run: the gate doesn't pick (`npm test` does, locally: tools/test.mjs).
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [quick, slow]
    concurrency:
      group: ci-test-${{ matrix.project }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # (--bail: the first failing test ends this project's run, so a red run is red in seconds, not after the whole suite)
      - run: npx vitest run --project ${{ matrix.project }} --bail 1

  # The required status: the static checks, the build and both projects of the tests, passed on this commit.
  check:
    needs: [static, test]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    concurrency:
      group: ci-check-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - run: |
          echo "static: ${{ needs.static.result }}, test: ${{ needs.test.result }}"
          [ "${{ needs.static.result }}" = success ] && [ "${{ needs.test.result }}" = success ]

  # Publishes the build `static` made (the same commit, the same tests, which `check` has seen pass): no second test or build run.
  # Every writer of gh-pages (this, `preview`, preview-cleanup.yml) goes through .github/scripts/pages.sh,
  # which pushes with a lease and writes again if gh-pages moved: none overwrites another's folder.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One deploy of main at a time, none cancelled while it runs. Runs reach this job in the order their `check`
    # finishes, not in commit order, so an older commit could follow a newer one: the first step skips it instead.
    concurrency:
      group: pages-main
      cancel-in-progress: false
    steps:
      - name: Is this still the newest commit on main?
        id: newest
        run: |
          head=$(git ls-remote "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "A newer commit ($head) is on main: its run deploys, not this one"; fi
      - if: steps.newest.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - if: steps.newest.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish dist to gh-pages (keeping the PR previews)
        if: steps.newest.outputs.current == 'true'
        run: .github/scripts/pages.sh main dist
        env:
          PAGES_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          MESSAGE: Deploy ${{ github.sha }}
