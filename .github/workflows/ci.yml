name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# (each job asks for what it writes)
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # A newer push to a PR, or to main, replaces the check still running for the older one: the newer commit carries
    # its changes, so its run tests them too. (Only this job: a deploy already writing is never cancelled.)
    concurrency:
      group: ci-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm run format:check
      - run: npm run knip
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 3

  # Publishes the build `check` made (the same commit, the same tests): no second test or build run.
  # Every writer of gh-pages (this, `preview`, preview-cleanup.yml) goes through .github/scripts/pages.sh,
  # which pushes with a lease and writes again if gh-pages moved: none overwrites another's folder.
  deploy:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    # One deploy of main at a time, none cancelled while it runs. Runs reach this job in the order their `check`
    # finishes, not in commit order, so an older commit could follow a newer one: the first step skips it instead.
    concurrency:
      group: pages-main
      cancel-in-progress: false
    steps:
      - name: Is this still the newest commit on main?
        id: newest
        run: |
          head=$(git ls-remote "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" refs/heads/main | cut -f1)
          if [ "$head" = "$GITHUB_SHA" ]; then echo "current=true" >> "$GITHUB_OUTPUT"; else echo "A newer commit ($head) is on main: its run deploys, not this one"; fi
      - if: steps.newest.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - if: steps.newest.outputs.current == 'true'
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Publish dist to gh-pages (keeping the PR previews)
        if: steps.newest.outputs.current == 'true'
        run: .github/scripts/pages.sh main dist
        env:
          PAGES_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          MESSAGE: Deploy ${{ github.sha }}
