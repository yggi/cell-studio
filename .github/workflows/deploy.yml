name: Deploy

# The deploy, on every merge into main (the owner, 2026-10-27, #481), and by hand (Actions -> Deploy -> Run workflow, to
# deploy main again). It runs `node tools/deploy.mjs` on `main` as it is now, the same gate as a deploy from a clone
# (docs/testing.md): every check CI runs, all the tests (`test:all`), a fresh build, and only then dist/ published to
# gh-pages's root (the PRs' previews in pr-<n>/ stay); then `node tools/live.mjs` checks the live site serves that build.
# A run that fails in seconds with no step is Actions blocked: deploy from a clone instead (the land skill).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# (one deploy at a time, never cut off halfway, the newest merge waiting wins; a preview written meanwhile is safe:
# pages.sh pushes with a lease and writes again if it lost)
concurrency:
  group: pages-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
      - name: Check, build and publish main
        run: node tools/deploy.mjs
        env:
          PAGES_REMOTE: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
      # (the runner's Chrome, as the smoke test's: Playwright's own isn't downloaded)
      - name: Check the live site serves it
        run: node tools/live.mjs
        env:
          CHROME_PATH: /usr/bin/google-chrome
