version: 2
updates:
  # Vite, Svelte, TypeScript and vitest are all very new majors: one PR a month per group, each a CI run (the family's CI
  # budget: no more often than monthly); whoever merges runs the checks on it first (AGENTS.md)
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # TypeScript 7 (the native compiler) doesn't resolve with svelte-check yet: reopen when it does (#51)
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # CI runs Node 22: the types follow it
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # the family's packages are pinned at a tag and moved by hand at each release, with the migration their changelog
      # names (AGENTS.md); Dependabot ranks their git tags wrongly (#529 offered @yggi/cells v0.14.1 → v0.12.0)
      - dependency-name: '@yggi/cells'
      - dependency-name: '@yggi/webmidi'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
